  <rect width="420" height="1090" rx="28" fill="#ffffff"/>
  <text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.2">What every screen answers, in</text><text x="24" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.2">the same order</text><text x="24" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Drawn on the options screen. Three questions,</text><text x="24" y="133" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">three different weights.</text><g transform="translate(77 168) scale(0.7) translate(-120 -148)"><rect x="120" y="148" width="330" height="600" rx="46" fill="#c9c9cf" stroke="none" stroke-width="1.5"/><rect x="150" y="192" width="120" height="14" rx="7" fill="#b3b3ba" stroke="none" stroke-width="1.5"/><rect x="150" y="222" width="180" height="30" rx="8" fill="#babac1" stroke="none" stroke-width="1.5"/><rect x="150" y="260" width="130" height="30" rx="8" fill="#babac1" stroke="none" stroke-width="1.5"/><path d="M132 346 Q132 318 160 318 H410 Q438 318 438 346 V708 Q438 736 404 736 H166 Q132 736 132 708 Z" fill="#fbfbfc"/><rect x="263" y="328" width="44" height="5" rx="3" fill="#d4d4da" stroke="none" stroke-width="1.5"/><path d="M158 350 C159.08 354.92 159.08 354.92 164 356 C159.08 357.08 159.08 357.08 158 362 C156.92 357.08 156.92 357.08 152 356 C156.92 354.92 156.92 354.92 158 350Z" fill="#c2600c"/><rect x="172" y="351" width="80" height="10" rx="5" fill="#cfcfd6" stroke="none" stroke-width="1.5"/><rect x="152" y="384" width="236" height="8" rx="4" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="402" width="156" height="8" rx="4" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="428" width="266" height="64" rx="12" fill="#ffffff" stroke="#111117" stroke-width="2.5"/><rect x="168" y="444" width="150" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="470" width="170" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="506" width="266" height="64" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1.2"/><rect x="168" y="522" width="132" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="548" width="150" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="584" width="266" height="64" rx="12" fill="url(#stripe)" stroke="#e8e8ed" stroke-width="1.2"/><rect x="168" y="600" width="142" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="626" width="160" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="360" y="442" width="42" height="18" rx="5" fill="#c2600c" stroke="none" stroke-width="1.5"/><text x="381" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">BEST</text><rect x="152" y="666" width="136" height="36" rx="18" fill="#ffffff" stroke="#111117" stroke-width="2"/><rect x="298" y="666" width="116" height="36" rx="18" fill="#ffffff" stroke="#e8e8ed" stroke-width="1.2"/><line x1="422" y1="451" x2="472" y2="451" stroke="#111117" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="451" r="14" fill="#111117"/><text x="486" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="422" y1="393" x2="472" y2="393" stroke="#c2600c" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="393" r="14" fill="#c2600c"/><text x="486" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="422" y1="684" x2="472" y2="684" stroke="#111117" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="684" r="14" fill="#111117"/><text x="486" y="689" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><rect x="24" y="612" width="372" height="150" rx="16" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><circle cx="54" cy="646" r="14" fill="#111117"/><text x="54" y="651" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="80" y="652" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">What am I looking at?</text><text x="80" y="674" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="1.2">HEAVIEST</text><text x="80" y="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">The work: the meeting and the times it</text><text x="80" y="720" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">could move to. Heaviest type on the</text><text x="80" y="740" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">screen.</text><rect x="24" y="774" width="372" height="150" rx="16" fill="#fbf1e8" stroke="none" stroke-width="1.5"/><circle cx="54" cy="808" r="14" fill="#c2600c"/><text x="54" y="813" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="80" y="814" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">What has the assistant done?</text><text x="80" y="836" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#c2600c" text-anchor="start" letter-spacing="1.2">QUIETEST</text><text x="80" y="862" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">Its message and the reason under each</text><text x="80" y="882" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">time. Always there, always lighter than</text><text x="80" y="902" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">the work.</text><rect x="24" y="936" width="372" height="130" rx="16" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><circle cx="54" cy="970" r="14" fill="#111117"/><text x="54" y="975" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="80" y="976" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">What do I have to decide?</text><text x="80" y="998" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="1.2">CLEAREST</text><text x="80" y="1024" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">The choice. Fewest words, strongest</text><text x="80" y="1044" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">outline, one obvious place to tap.</text>
</svg>
