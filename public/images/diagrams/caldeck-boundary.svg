<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img">
  <rect width="1200" height="520" rx="26" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d3d3da"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2600c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111117" text-anchor="start">Where the AI stops</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The assistant does everything up to the line, and nothing past it.</text><rect x="56" y="132" width="400" height="300" rx="18" fill="rgba(194,96,12,0.05)" stroke="#c2600c" stroke-width="1.5" stroke-dasharray="7 6"/><text x="84" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2600c" text-anchor="start" letter-spacing="1.4">THE ASSISTANT PREPARES</text><circle cx="92" cy="205" r="3.5" fill="#c2600c"/><text x="110" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Reads four calendars</text><circle cx="92" cy="245" r="3.5" fill="#c2600c"/><text x="110" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Ranks three times, with reasons</text><circle cx="92" cy="285" r="3.5" fill="#c2600c"/><text x="110" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Catches the double booking</text><circle cx="92" cy="325" r="3.5" fill="#c2600c"/><text x="110" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Checks your focus hours</text><circle cx="92" cy="365" r="3.5" fill="#c2600c"/><text x="110" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Writes the message</text><text x="84" y="412" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#71717a" text-anchor="start">Nothing is saved. Swipe down and it is gone.</text><rect x="496" y="132" width="218" height="300" rx="18" fill="rgba(17,17,23,0.05)" stroke="#111117" stroke-width="2"/><text x="605" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111117" text-anchor="middle" letter-spacing="1.4">YOU DECIDE</text><text x="520" y="224" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#111117" text-anchor="start">You read the old time</text><text x="520" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#111117" text-anchor="start">against the new one,</text><text x="520" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#111117" text-anchor="start">edit the message, and</text><text x="520" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#111117" text-anchor="start">press send.</text><text x="605" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#71717a" text-anchor="middle">The only step</text><text x="605" y="418" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#71717a" text-anchor="middle">that cannot be undone</text><rect x="744" y="132" width="400" height="300" rx="18" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="772" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="1.4">THE PRODUCT COMMITS</text><circle cx="780" cy="205" r="3.5" fill="#d3d3da"/><text x="798" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Invites reach four calendars</text><circle cx="780" cy="245" r="3.5" fill="#d3d3da"/><text x="798" y="250" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Replies are tracked</text><circle cx="780" cy="285" r="3.5" fill="#d3d3da"/><text x="798" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">Undo stays live while you wait</text><circle cx="780" cy="325" r="3.5" fill="#d3d3da"/><text x="798" y="330" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#43434d" text-anchor="start">State updates everywhere</text><line x1="462" y1="282" x2="490" y2="282" stroke="#c2600c" stroke-width="2" marker-end="url(#ao)"/><line x1="720" y1="282" x2="738" y2="282" stroke="#111117" stroke-width="2" marker-end="url(#a)"/>
</svg>
