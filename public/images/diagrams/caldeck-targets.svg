<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img">
  <rect width="1200" height="588" rx="26" fill="#141416" stroke="#26262a" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3a42"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="start">What I would measure</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">Targets I would set before building. Not results — nothing has been tested.</text><text x="470" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a8a92" text-anchor="middle">0%</text><text x="790" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a8a92" text-anchor="middle">50%</text><text x="1110" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#8a8a92" text-anchor="middle">100%</text><text x="56" y="184" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">Top suggestion accepted</text><text x="56" y="218" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Below 50% and the ranking is not earning its</text><text x="56" y="235" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">badge</text><rect x="470" y="168" width="640" height="26" rx="13" fill="#0f0f12" stroke="#26262a"/><rect x="822" y="168" width="96" height="26" rx="13" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="1.5"/><text x="932" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#fb923c" text-anchor="start">55–70%</text><text x="56" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">Finished without leaving the day</text><text x="56" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">The whole point is not leaving the day you are</text><text x="56" y="327" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">looking at</text><rect x="470" y="260" width="640" height="26" rx="13" fill="#0f0f12" stroke="#26262a"/><rect x="918" y="260" width="96" height="26" rx="13" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="1.5"/><text x="1028" y="278" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#fb923c" text-anchor="start">70–85%</text><text x="56" y="368" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">Sends undone within an hour</text><text x="56" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">A send that gets undone means the review</text><text x="56" y="419" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">screen failed</text><rect x="470" y="352" width="640" height="26" rx="13" fill="#0f0f12" stroke="#26262a"/><rect x="470" y="352" width="32" height="26" rx="13" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="1.5"/><text x="516" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#fb923c" text-anchor="start">under 5%</text><text x="56" y="460" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#ffffff" text-anchor="start">Focus Time set in week one</text><text x="56" y="494" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">The setting the meeting flow depends on</text><rect x="470" y="444" width="640" height="26" rx="13" fill="#0f0f12" stroke="#26262a"/><rect x="726" y="444" width="96" height="26" rx="13" fill="rgba(251,146,60,0.12)" stroke="#fb923c" stroke-width="1.5"/><text x="836" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#fb923c" text-anchor="start">40–55%</text><text x="56" y="544" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">Each one can fail on its own. No single number can make the assistant look better than it is.</text>
</svg>
