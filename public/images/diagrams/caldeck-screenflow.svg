<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#111117" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f1f4"/><rect width="4" height="10" fill="#dcdce2"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#ffffff"/>
  <text x="64" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.3">How the screens connect</text><text x="64" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e78" text-anchor="start">Two ways in, one path through, and always back to the day you started on.</text><rect x="64" y="300" width="214" height="124" rx="18" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="88" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#111117" text-anchor="start">The calendar</text><text x="88" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Day, week and month.</text><text x="88" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Home.</text><rect x="352" y="172" width="236" height="124" rx="18" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><path d="M380 201 C381.26 206.74 381.26 206.74 387 208 C381.26 209.26 381.26 209.26 380 215 C378.74 209.26 378.74 209.26 373 208 C378.74 206.74 378.74 206.74 380 201Z" fill="#c2600c"/><text x="396" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#c2600c" text-anchor="start">Calendar mode</text><text x="376" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Your day, with an Ask</text><text x="376" y="262" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">assistant button that</text><text x="376" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">opens a sheet over it.</text><rect x="352" y="428" width="236" height="124" rx="18" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><path d="M380 457 C381.26 462.74 381.26 462.74 387 464 C381.26 465.26 381.26 465.26 380 471 C378.74 465.26 378.74 465.26 373 464 C378.74 462.74 378.74 462.74 380 457Z" fill="#c2600c"/><text x="396" y="470" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#c2600c" text-anchor="start">Assistant mode</text><text x="376" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Switch at the top. A</text><text x="376" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">full screen of its own.</text><rect x="668" y="300" width="214" height="124" rx="18" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><text x="692" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#111117" text-anchor="start">Options</text><text x="692" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Three times, ranked,</text><text x="692" y="390" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">each with a reason.</text><rect x="950" y="300" width="186" height="124" rx="18" fill="#ffffff" stroke="#111117" stroke-width="2.5"/><text x="974" y="342" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#111117" text-anchor="start">Review</text><text x="974" y="370" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">You press send.</text><rect x="668" y="150" width="214" height="96" rx="18" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.5" stroke-dasharray="7 6"/><text x="692" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="650" fill="#111117" text-anchor="start">Focus Time</text><text x="692" y="220" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Read as a rule.</text><path d="M278 340 L304 340 Q316 340 316 328 L316 246 Q316 234 328 234 L346 234" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M278 384 L304 384 Q316 384 316 396 L316 478 Q316 490 328 490 L346 490" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M588 234 L616 234 Q628 234 628 246 L628 334 Q628 346 640 346 L662 346" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M588 490 L616 490 Q628 490 628 478 L628 392 Q628 380 640 380 L662 380" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M775 246 L775 294" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#a)"/><path d="M882 362 L944 362" fill="none" stroke="#111117" stroke-width="2" stroke-linecap="round" marker-end="url(#ai)"/><path d="M1043 424 L1043 598 Q1043 610 1031 610 L183 610 Q171 610 171 598 L171 430" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="7 7" stroke-linecap="round" marker-end="url(#a)"/><rect x="429.05" y="592" width="355.9" height="36" rx="18" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.5"/><text x="607" y="616" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#3f3f48" text-anchor="middle">Sent or cancelled: back to the same day</text><rect x="64" y="667" width="22" height="16" rx="5" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><text x="98" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">The assistant</text><rect x="242" y="667" width="22" height="16" rx="5" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="276" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Where you decide</text><rect x="444" y="667" width="22" height="16" rx="5" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.5" stroke-dasharray="4 3"/><text x="478" y="681" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Read, never visited</text>
</svg>
