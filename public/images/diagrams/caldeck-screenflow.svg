<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img">
  <rect width="1200" height="640" rx="26" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d3d3da"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2600c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111117" text-anchor="start">How the screens connect</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Every route in and out of the assistant, and where each one returns you to.</text><rect x="56" y="250" width="196" height="96" rx="14" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="154" y="303" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="154" y="300" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111117" text-anchor="middle">The calendar</text><text x="154" y="322" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">day, week, month</text><rect x="320" y="150" width="210" height="72" rx="14" fill="rgba(194,96,12,0.10)" stroke="#c2600c" stroke-width="1.5"/><text x="425" y="191" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="425" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#c2600c" text-anchor="middle">Ask assistant</text><text x="425" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">a sheet over today</text><rect x="320" y="374" width="210" height="72" rx="14" fill="rgba(194,96,12,0.10)" stroke="#c2600c" stroke-width="1.5"/><text x="425" y="415" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="425" y="406" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#c2600c" text-anchor="middle">Assistant mode</text><text x="425" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">a place of its own</text><path d="M252 282 H 286 V 186 H 316" fill="none" stroke="#d3d3da" stroke-width="1.6" marker-end="url(#a)"/><path d="M252 314 H 286 V 410 H 316" fill="none" stroke="#d3d3da" stroke-width="1.6" marker-end="url(#a)"/><rect x="600" y="250" width="200" height="96" rx="14" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="700" y="303" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="700" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111117" text-anchor="middle">Options</text><text x="700" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">ranked, with reasons</text><path d="M530 186 H 564 V 290 H 596" fill="none" stroke="#d3d3da" stroke-width="1.6" marker-end="url(#a)"/><path d="M530 410 H 564 V 306 H 596" fill="none" stroke="#d3d3da" stroke-width="1.6" marker-end="url(#a)"/><rect x="868" y="250" width="200" height="96" rx="14" fill="rgba(17,17,23,0.05)" stroke="#111117" stroke-width="2"/><text x="968" y="303" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="968" y="288" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111117" text-anchor="middle">Review</text><text x="968" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">you press send</text><path d="M804 298 H 864" fill="none" stroke="#d3d3da" stroke-width="1.6" marker-end="url(#a)"/><path d="M968 346 V 470 H 154 V 350" fill="none" stroke="#d3d3da" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="560" y="492" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#71717a" text-anchor="middle">After sending, and after any cancel, you land back on the day you started from</text><rect x="868" y="116" width="200" height="76" rx="14" fill="#ffffff" stroke="#d3d3da" stroke-width="1.5" stroke-dasharray="6 5"/><text x="968" y="159" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle"></text><text x="968" y="148" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#111117" text-anchor="middle">Focus Time</text><text x="968" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#71717a" text-anchor="middle">settings, read as a rule</text><path d="M968 196 V 246" fill="none" stroke="#d3d3da" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="56" y="560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Two ways in, one path through, and one way back. The assistant never becomes a place you have to get out of, which is</text><text x="56" y="581" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">the whole reason the calendar stays on screen behind it.</text>
</svg>
