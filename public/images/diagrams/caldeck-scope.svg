  <text x="64" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.3">What CalDeck is, and what this study covers</text><text x="64" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e78" text-anchor="start">A complete calendar. The case study zooms in on the assistant inside it.</text><rect x="64" y="150" width="1072" height="446" rx="22" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><text x="96" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#6e6e78" text-anchor="start" letter-spacing="1.8">THE CALENDAR</text><text x="1104" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="end">Built to the standard people expect</text><rect x="96" y="216" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="216.75" y="247" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Day, week and month views</text><rect x="351.5" y="216" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="472.25" y="247" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Events and details</text><rect x="607" y="216" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="727.75" y="247" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Create and invite</text><rect x="862.5" y="216" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="983.25" y="247" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Search</text><rect x="96" y="280" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="216.75" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Reminders</text><rect x="351.5" y="280" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="472.25" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Notifications</text><rect x="607" y="280" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="727.75" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Accounts and sync</text><rect x="862.5" y="280" width="241.5" height="50" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="983.25" y="311" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#3f3f48" text-anchor="middle">Sharing and permissions</text><rect x="96" y="364" width="1008" height="200" rx="18" fill="#fbf1e8" stroke="#c2600c" stroke-width="2"/><path d="M132 393 C133.62 400.38 133.62 400.38 141 402 C133.62 403.62 133.62 403.62 132 411 C130.38 403.62 130.38 403.62 123 402 C130.38 400.38 130.38 400.38 132 393Z" fill="#c2600c"/><text x="152" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#c2600c" text-anchor="start" letter-spacing="1.8">THE AI ASSISTANT · WHAT THIS STUDY COVERS</text><rect x="124" y="430" width="306.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="146" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="650" fill="#111117" text-anchor="start">Moving a meeting</text><text x="146" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">Ranks the times that work, then</text><text x="146" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">stops before sending.</text><rect x="446.6666666666667" y="430" width="306.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="468.6666666666667" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="650" fill="#111117" text-anchor="start">Focus Time</text><text x="468.6666666666667" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">Hours you protect once, which</text><text x="468.6666666666667" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">every suggestion has to respect.</text><rect x="769.3333333333334" y="430" width="306.6666666666667" height="110" rx="14" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="791.3333333333334" y="468" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="650" fill="#111117" text-anchor="start">When things go wrong</text><text x="791.3333333333334" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">Four situations that change the</text><text x="791.3333333333334" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#6e6e78" text-anchor="start">shape of the screen.</text>
