  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111117" text-anchor="start">What CalDeck is, and what this study covers</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">A complete calendar. The case study zooms in on one layer of it.</text><rect x="56" y="126" width="1088" height="380" rx="20" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="84" y="164" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="1.5">CALDECK · A CALENDAR APP</text><rect x="84" y="184" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="207" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Day, week and month views</text><rect x="346" y="184" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="469" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Event details</text><rect x="608" y="184" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="731" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Create and invite</text><rect x="870" y="184" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="993" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Search</text><rect x="84" y="240" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="207" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Notifications</text><rect x="346" y="240" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="469" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Accounts and sync</text><rect x="608" y="240" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="731" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Reminders</text><rect x="870" y="240" width="246" height="44" rx="10" fill="#ffffff" stroke="#d3d3da" stroke-width="1"/><text x="993" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#43434d" text-anchor="middle">Sharing and permissions</text><rect x="84" y="306" width="1032" height="176" rx="16" fill="rgba(194,96,12,0.10)" stroke="#c2600c" stroke-width="2"/><text x="112" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2600c" text-anchor="start" letter-spacing="1.5">THE AI LAYER · WHAT THIS CASE STUDY COVERS</text><rect x="112" y="360" width="314.6666666666667" height="98" rx="12" fill="#ffffff" stroke="rgba(194,96,12,0.35)" stroke-width="1.5"/><text x="132" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#111117" text-anchor="start">Rescheduling a meeting</text><text x="132" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">The whole errand, start to finish</text><rect x="442.6666666666667" y="360" width="314.6666666666667" height="98" rx="12" fill="#ffffff" stroke="rgba(194,96,12,0.35)" stroke-width="1.5"/><text x="462.6666666666667" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#111117" text-anchor="start">Focus Time</text><text x="462.6666666666667" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">The rule the reschedule has to</text><text x="462.6666666666667" y="433" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">read</text><rect x="773.3333333333334" y="360" width="314.6666666666667" height="98" rx="12" fill="#ffffff" stroke="rgba(194,96,12,0.35)" stroke-width="1.5"/><text x="793.3333333333334" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="600" fill="#111117" text-anchor="start">When it breaks</text><text x="793.3333333333334" y="416" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">Four branches the normal path</text><text x="793.3333333333334" y="433" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">never reaches</text><text x="56" y="538" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The calendar itself is a solved problem and is designed to the standard the category expects. The assistant is the</text><text x="56" y="559" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">part that is not solved, so it is the part this study argues about.</text>
</svg>
