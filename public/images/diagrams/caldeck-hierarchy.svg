<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img">
  <rect width="1200" height="540" rx="26" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d3d3da"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2600c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111117" text-anchor="start">What every screen answers, in the same order</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Three questions, ranked by weight. A new screen gets read the way the last one did.</text><rect x="56" y="138" width="96" height="96" rx="14" fill="rgba(17,17,23,0.05)" stroke="#d3d3da" stroke-width="1.5"/><text x="104" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#111117" text-anchor="middle">1</text><text x="180" y="174" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#111117" text-anchor="start">What am I looking at?</text><text x="180" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#43434d" text-anchor="start">The work itself. Your day, your meeting, your hours. Heaviest thing on the</text><text x="180" y="221" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#43434d" text-anchor="start">screen.</text><rect x="1010" y="151" width="110" height="70" rx="8" fill="rgba(17,17,23,0.05)" stroke="#d3d3da"/><text x="1065" y="191" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Loudest</text><rect x="56" y="256" width="96" height="96" rx="14" fill="rgba(194,96,12,0.10)" stroke="#c2600c" stroke-width="1.5"/><text x="104" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#c2600c" text-anchor="middle">2</text><text x="180" y="292" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#111117" text-anchor="start">What has the assistant done?</text><text x="180" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#43434d" text-anchor="start">Its answer, its reasoning, its cards. Present, but secondary to the work.</text><rect x="1010" y="277.74" width="110" height="52.519999999999996" rx="8" fill="rgba(194,96,12,0.10)" stroke="#c2600c"/><text x="1065" y="309" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#c2600c" text-anchor="middle">Quietest</text><rect x="56" y="374" width="96" height="96" rx="14" fill="rgba(17,17,23,0.05)" stroke="#d3d3da" stroke-width="1.5"/><text x="104" y="432" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#111117" text-anchor="middle">3</text><text x="180" y="410" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#111117" text-anchor="start">What do I have to decide?</text><text x="180" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#43434d" text-anchor="start">The action. Fewest words, clearest target, always the last thing you</text><text x="180" y="457" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#43434d" text-anchor="start">reach.</text><rect x="1010" y="390.45" width="110" height="63.1" rx="8" fill="rgba(17,17,23,0.05)" stroke="#d3d3da"/><text x="1065" y="427" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#71717a" text-anchor="middle">Clearest</text><text x="56" y="498" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The assistant is deliberately the quiet one. It is doing the most work and it should be the second thing you look at,</text><text x="56" y="519" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">not the first.</text>
</svg>
