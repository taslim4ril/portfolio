  <rect width="1200" height="790" rx="28" fill="#ffffff"/>
  <text x="64" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.3">What every screen answers, in the same order</text><text x="64" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e78" text-anchor="start">Drawn on the options screen. Three questions, three different weights.</text><rect x="120" y="148" width="330" height="600" rx="46" fill="#c9c9cf" stroke="none" stroke-width="1.5"/><rect x="150" y="192" width="120" height="14" rx="7" fill="#b3b3ba" stroke="none" stroke-width="1.5"/><rect x="150" y="222" width="180" height="30" rx="8" fill="#babac1" stroke="none" stroke-width="1.5"/><rect x="150" y="260" width="130" height="30" rx="8" fill="#babac1" stroke="none" stroke-width="1.5"/><path d="M132 346 Q132 318 160 318 H410 Q438 318 438 346 V708 Q438 736 404 736 H166 Q132 736 132 708 Z" fill="#fbfbfc"/><rect x="263" y="328" width="44" height="5" rx="3" fill="#d4d4da" stroke="none" stroke-width="1.5"/><path d="M158 350 C159.08 354.92 159.08 354.92 164 356 C159.08 357.08 159.08 357.08 158 362 C156.92 357.08 156.92 357.08 152 356 C156.92 354.92 156.92 354.92 158 350Z" fill="#c2600c"/><rect x="172" y="351" width="80" height="10" rx="5" fill="#cfcfd6" stroke="none" stroke-width="1.5"/><rect x="152" y="384" width="236" height="8" rx="4" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="402" width="156" height="8" rx="4" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="428" width="266" height="64" rx="12" fill="#ffffff" stroke="#111117" stroke-width="2.5"/><rect x="168" y="444" width="150" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="470" width="170" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="506" width="266" height="64" rx="12" fill="#ffffff" stroke="#e8e8ed" stroke-width="1.2"/><rect x="168" y="522" width="132" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="548" width="150" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="152" y="584" width="266" height="64" rx="12" fill="url(#stripe)" stroke="#e8e8ed" stroke-width="1.2"/><rect x="168" y="600" width="142" height="14" rx="5" fill="#111117" stroke="none" stroke-width="1.5"/><rect x="168" y="626" width="160" height="6" rx="3" fill="#e7b58c" stroke="none" stroke-width="1.5"/><rect x="360" y="442" width="42" height="18" rx="5" fill="#c2600c" stroke="none" stroke-width="1.5"/><text x="381" y="455" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.6">BEST</text><rect x="152" y="666" width="136" height="36" rx="18" fill="#ffffff" stroke="#111117" stroke-width="2"/><rect x="298" y="666" width="116" height="36" rx="18" fill="#ffffff" stroke="#e8e8ed" stroke-width="1.2"/><line x1="422" y1="451" x2="472" y2="451" stroke="#111117" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="451" r="14" fill="#111117"/><text x="486" y="456" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="422" y1="393" x2="472" y2="393" stroke="#c2600c" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="393" r="14" fill="#c2600c"/><text x="486" y="398" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="422" y1="684" x2="472" y2="684" stroke="#111117" stroke-width="1.5" stroke-dasharray="3 4"/><circle cx="486" cy="684" r="14" fill="#111117"/><text x="486" y="689" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="560" y="196" width="576" height="150" rx="18" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><circle cx="600" cy="240" r="17" fill="#111117"/><text x="600" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="632" y="247" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start">What am I looking at?</text><text x="632" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">The work: the meeting and the times it could move to.</text><text x="632" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">Heaviest type on the screen.</text><rect x="1015.2" y="224" width="96.8" height="32" rx="16" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.2"/><text x="1063.6" y="245" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#111117" text-anchor="middle">Heaviest</text><rect x="560" y="372" width="576" height="150" rx="18" fill="#fbf1e8" stroke="none" stroke-width="1.5"/><circle cx="600" cy="416" r="17" fill="#c2600c"/><text x="600" y="422" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="632" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start">What has the assistant done?</text><text x="632" y="462" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">Its message and the reason under each time. Always</text><text x="632" y="486" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">there, always lighter than the work.</text><rect x="1015.2" y="400" width="96.8" height="32" rx="16" fill="#ffffff" stroke="#e7b58c" stroke-width="1.2"/><text x="1063.6" y="421" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#c2600c" text-anchor="middle">Quietest</text><rect x="560" y="548" width="576" height="150" rx="18" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><circle cx="600" cy="592" r="17" fill="#111117"/><text x="600" y="598" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="632" y="599" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start">What do I have to decide?</text><text x="632" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">The choice. Fewest words, strongest outline, one</text><text x="632" y="662" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#3f3f48" text-anchor="start">obvious place to tap.</text><rect x="1015.2" y="576" width="96.8" height="32" rx="16" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.2"/><text x="1063.6" y="597" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#111117" text-anchor="middle">Clearest</text>
</svg>
