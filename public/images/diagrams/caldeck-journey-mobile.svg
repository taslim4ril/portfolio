amily="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#c2600c" text-anchor="start">Checks 4 calendars and</text><text x="178" y="615" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#c2600c" text-anchor="start">focus hours</text><circle cx="42" cy="509" r="15" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="42" y="514" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#3f3f48" text-anchor="middle">3</text><rect x="70" y="656" width="326" height="160" rx="14" fill="#f4f4f6" stroke="none" stroke-width="2"/><text x="86" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="start">Choose</text><text x="86" y="714" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#a1a1aa" text-anchor="start" letter-spacing="1.1">PERSON</text><text x="178" y="714" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">Picks one, or their own</text><text x="86" y="741" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#a1a1aa" text-anchor="start" letter-spacing="1.1">SCREEN</text><text x="178" y="741" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">Clashes drawn on the real</text><text x="178" y="760" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">day</text><text x="86" y="787" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#c2600c" text-anchor="start" letter-spacing="1.1">ASSISTANT</text><text x="178" y="787" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#c2600c" text-anchor="start">Warns, but does not block</text><circle cx="42" cy="681" r="15" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="42" y="686" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#3f3f48" text-anchor="middle">4</text><rect x="70" y="828" width="326" height="160" rx="14" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="86" y="858" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="start">Review</text><rect x="246" y="840" width="136" height="26" rx="13" fill="#111117" stroke="none" stroke-width="1.5"/><text x="314" y="858" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Cannot be skipped</text><text x="86" y="886" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#a1a1aa" text-anchor="start" letter-spacing="1.1">PERSON</text><text x="178" y="886" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">Reads what will change</text><text x="86" y="913" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="650" fill="#a1a1aa" text-anchor="start" letter-spacing="1.1">SCREEN</text><text x="178" y="913" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="start">Old time cross