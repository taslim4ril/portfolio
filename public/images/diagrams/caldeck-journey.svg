  <text x="64" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.3">The reschedule journey</text><text x="64" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e78" text-anchor="start">Six stages, three lanes. The calendar stays behind the sheet the whole time.</text><rect x="820.6666666666666" y="140" width="160.66666666666666" height="474" rx="18" fill="none" stroke="#111117" stroke-width="2"/><line x1="274.3333333333333" y1="176" x2="1057.6666666666665" y2="176" stroke="#d6d6dd" stroke-width="2"/><circle cx="274.3333333333333" cy="176" r="19" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="274.3333333333333" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#3f3f48" text-anchor="middle">1</text><text x="274.3333333333333" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Ask</text><circle cx="430.99999999999994" cy="176" r="19" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="430.99999999999994" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#3f3f48" text-anchor="middle">2</text><text x="430.99999999999994" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Narrow</text><circle cx="587.6666666666666" cy="176" r="19" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="587.6666666666666" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#3f3f48" text-anchor="middle">3</text><text x="587.6666666666666" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Options</text><circle cx="744.3333333333334" cy="176" r="19" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="744.3333333333334" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#3f3f48" text-anchor="middle">4</text><text x="744.3333333333334" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Choose</text><circle cx="901" cy="176" r="19" fill="#111117" stroke="#111117" stroke-width="2"/><text x="901" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">5</text><text x="901" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Review</text><circle cx="1057.6666666666665" cy="176" r="19" fill="#ffffff" stroke="#d6d6dd" stroke-width="2"/><text x="1057.6666666666665" y="182" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#3f3f48" text-anchor="middle">6</text><text x="1057.6666666666665" y="226" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="650" fill="#111117" text-anchor="middle">Send</text><text x="64" y="306" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#6e6e78" text-anchor="start" letter-spacing="1.4">THE PERSON</text><rect x="202" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="216" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Taps</text><text x="216" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Reschedule, or</text><text x="216" y="326" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">types it</text><rect x="358.66666666666663" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="372.66666666666663" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Picks which</text><text x="372.66666666666663" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">meeting moves</text><rect x="515.3333333333333" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="529.3333333333333" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Reads three</text><text x="529.3333333333333" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">times</text><rect x="672" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="686" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Picks one, or</text><text x="686" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">their own</text><rect x="828.6666666666666" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="842.6666666666666" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Reads what</text><text x="842.6666666666666" y="305" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">will change</text><rect x="985.3333333333333" y="252" width="144.66666666666666" height="108" rx="12" fill="#f4f4f6" stroke="none" stroke-width="1"/><text x="999.3333333333333" y="284" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Presses send</text><text x="64" y="424" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#6e6e78" text-anchor="start" letter-spacing="1.4">ON SCREEN</text><rect x="202" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="216" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">A sheet opens</text><text x="216" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">over the day</text><rect x="358.66666666666663" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="372.66666666666663" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Their</text><text x="372.66666666666663" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">meetings,</text><text x="372.66666666666663" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">listed</text><rect x="515.3333333333333" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="529.3333333333333" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Each time with</text><text x="529.3333333333333" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">its reason</text><rect x="672" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="686" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Clashes drawn</text><text x="686" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">on the real</text><text x="686" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">day</text><rect x="828.6666666666666" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="842.6666666666666" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Old time</text><text x="842.6666666666666" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">crossed out</text><rect x="985.3333333333333" y="370" width="144.66666666666666" height="108" rx="12" fill="#fafafb" stroke="#e8e8ed" stroke-width="1"/><text x="999.3333333333333" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">Undo stays</text><text x="999.3333333333333" y="423" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">while replies</text><text x="999.3333333333333" y="444" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#3f3f48" text-anchor="start">are out</text><path d="M70 531 C71.08 535.92 71.08 535.92 76 537 C71.08 538.08 71.08 538.08 70 543 C68.92 538.08 68.92 538.08 64 537 C68.92 535.92 68.92 535.92 70 531Z" fill="#c2600c"/><text x="82" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="650" fill="#c2600c" text-anchor="start" letter-spacing="1.4">ASSISTANT</text><rect x="202" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="216" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Reads the</text><text x="216" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">request</text><rect x="358.66666666666663" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="372.66666666666663" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Flags the one</text><text x="372.66666666666663" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">they cannot</text><text x="372.66666666666663" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">move</text><rect x="515.3333333333333" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="529.3333333333333" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Checks 4</text><text x="529.3333333333333" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">calendars and</text><text x="529.3333333333333" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">focus hours</text><rect x="672" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="686" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Warns, but</text><text x="686" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">does not block</text><rect x="828.6666666666666" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="842.6666666666666" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Writes the</text><text x="842.6666666666666" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">message, then</text><text x="842.6666666666666" y="562" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">stops</text><rect x="985.3333333333333" y="488" width="144.66666666666666" height="108" rx="12" fill="#fbf1e8" stroke="none" stroke-width="1"/><text x="999.3333333333333" y="520" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">Watches for</text><text x="999.3333333333333" y="541" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="500" fill="#c2600c" text-anchor="start">replies</text><rect x="830.6666666666666" y="632" width="140.66666666666666" height="34" rx="17" fill="#111117" stroke="none" stroke-width="1.5"/><text x="901" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Cannot be skipped</text><text x="64" y="654" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Every path, including the ones that go wrong, passes through stage 5.</text>
