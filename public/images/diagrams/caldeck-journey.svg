<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img">
  <rect width="1200" height="500" rx="26" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d3d3da"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2600c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#111117" text-anchor="start">The reschedule journey</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Six stages. The calendar stays behind the sheet for all of them.</text><text x="56" y="194" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="1.2">You</text><text x="56" y="254" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="1.2">On screen</text><text x="56" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#71717a" text-anchor="start" letter-spacing="1.2">The assistant</text><rect x="186" y="122" width="145.66666666666666" height="40" rx="10" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="258.8333333333333" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#43434d" text-anchor="middle">1  Ask</text><text x="188" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Tap Reschedule, or</text><text x="188" y="205" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">type it</text><text x="188" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">The sheet opens over</text><text x="188" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">the day</text><text x="188" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Reads the request</text><line x1="333.66666666666663" y1="142" x2="343.66666666666663" y2="142" stroke="#d3d3da" stroke-width="1.5" marker-end="url(#a)"/><rect x="345.66666666666663" y="122" width="145.66666666666666" height="40" rx="10" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="418.49999999999994" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#43434d" text-anchor="middle">2  Narrow</text><text x="347.66666666666663" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Pick which meeting</text><text x="347.66666666666663" y="205" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">moves</text><text x="347.66666666666663" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Your three meetings,</text><text x="347.66666666666663" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">listed</text><text x="347.66666666666663" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Flags the one you</text><text x="347.66666666666663" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">cannot move</text><line x1="493.33333333333326" y1="142" x2="503.33333333333326" y2="142" stroke="#d3d3da" stroke-width="1.5" marker-end="url(#a)"/><rect x="505.3333333333333" y="122" width="145.66666666666666" height="40" rx="10" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="578.1666666666666" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#43434d" text-anchor="middle">3  Options</text><text x="507.3333333333333" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Read three times</text><text x="507.3333333333333" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Each with its reason</text><text x="507.3333333333333" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Checks 4 calendars and</text><text x="507.3333333333333" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">focus hours</text><line x1="653" y1="142" x2="663" y2="142" stroke="#d3d3da" stroke-width="1.5" marker-end="url(#a)"/><rect x="665" y="122" width="145.66666666666666" height="40" rx="10" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="737.8333333333334" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#43434d" text-anchor="middle">4  Choose</text><text x="667" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Pick one, or pick your</text><text x="667" y="205" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">own</text><text x="667" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Clashes drawn on the</text><text x="667" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">real day</text><text x="667" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Warns, does not block</text><line x1="812.6666666666666" y1="142" x2="822.6666666666666" y2="142" stroke="#d3d3da" stroke-width="1.5" marker-end="url(#a)"/><rect x="824.6666666666666" y="122" width="145.66666666666666" height="40" rx="10" fill="rgba(17,17,23,0.05)" stroke="#111117" stroke-width="1.5"/><text x="897.5" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#111117" text-anchor="middle">5  Review</text><text x="826.6666666666666" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Read what will change</text><text x="826.6666666666666" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Old time crossed out</text><text x="826.6666666666666" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Writes the message.</text><text x="826.6666666666666" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Stops here.</text><line x1="972.3333333333333" y1="142" x2="982.3333333333333" y2="142" stroke="#d3d3da" stroke-width="1.5" marker-end="url(#a)"/><rect x="984.3333333333333" y="122" width="145.66666666666666" height="40" rx="10" fill="#f5f5f7" stroke="#d3d3da" stroke-width="1.5"/><text x="1057.1666666666665" y="147" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#43434d" text-anchor="middle">6  Send</text><text x="986.3333333333333" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Press send</text><text x="986.3333333333333" y="248" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">Undo stays while</text><text x="986.3333333333333" y="265" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#43434d" text-anchor="start">replies are out</text><text x="986.3333333333333" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#c2600c" text-anchor="start">Watches for replies</text><line x1="56" y1="386" x2="1144" y2="386" stroke="#e5e5ea"/><text x="56" y="420" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">Stage 5 is the only one that cannot be skipped. Every branch in the next figure lands on it before anything is</text><text x="56" y="441" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">sent.</text>
</svg>
