<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img">
  <rect width="1200" height="620" rx="26" fill="#141416" stroke="#26262a" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3a42"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="start">Every path ends in the same place</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">Four things go wrong. None of them skips the review step.</text><rect x="56" y="146" width="470" height="56" rx="12" fill="#1e1e23" stroke="#3a3a42" stroke-width="1.5"/><text x="78" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">The normal path</text><text x="78" y="189" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Three times work. Pick one.</text><path d="M534 174 H 608 V 300" fill="none" stroke="#3a3a42" stroke-width="1.4"/><rect x="56" y="220" width="470" height="56" rx="12" fill="rgba(251,146,60,0.05)" stroke="rgba(251,146,60,0.45)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="244" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#fb923c" text-anchor="start">It starts in 12 minutes</text><text x="78" y="263" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Three blunt options, and a push notification</text><path d="M534 248 H 608 V 300" fill="none" stroke="#3a3a42" stroke-width="1.4"/><rect x="56" y="294" width="470" height="56" rx="12" fill="rgba(251,146,60,0.05)" stroke="rgba(251,146,60,0.45)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#fb923c" text-anchor="start">Someone is at another company</text><text x="78" y="337" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Their column is drawn as no access. Offer a poll.</text><path d="M534 322 H 608 V 300" fill="none" stroke="#3a3a42" stroke-width="1.4"/><rect x="56" y="368" width="470" height="56" rx="12" fill="rgba(251,146,60,0.05)" stroke="rgba(251,146,60,0.45)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="392" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#fb923c" text-anchor="start">Someone said no</text><text x="78" y="411" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Only interrupts you if that no matters</text><path d="M534 396 H 608 V 300" fill="none" stroke="#3a3a42" stroke-width="1.4"/><rect x="56" y="442" width="470" height="56" rx="12" fill="rgba(251,146,60,0.05)" stroke="rgba(251,146,60,0.45)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="78" y="466" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#fb923c" text-anchor="start">The whole series moves</text><text x="78" y="485" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="start">Eleven weeks, each handled on its own</text><path d="M534 470 H 608 V 300" fill="none" stroke="#3a3a42" stroke-width="1.4"/><line x1="608" y1="300" x2="700" y2="300" stroke="#3a3a42" stroke-width="1.6" marker-end="url(#a)"/><rect x="708" y="244" width="200" height="112" rx="16" fill="rgba(255,255,255,0.07)" stroke="#ffffff" stroke-width="2"/><text x="808" y="290" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Review</text><text x="808" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8a8a92" text-anchor="middle">You press send</text><line x1="912" y1="300" x2="980" y2="300" stroke="#ffffff" stroke-width="2" marker-end="url(#a)"/><rect x="988" y="258" width="156" height="84" rx="14" fill="#1e1e23" stroke="#3a3a42" stroke-width="1.5"/><text x="1066" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#c6c6cd" text-anchor="middle">Sent</text><text x="1066" y="318" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="middle">Undo still live</text><text x="56" y="552" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">The four branches are not variations on the normal path. Each changes the shape of the screen, and each</text><text x="56" y="573" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">still stops at the same gate.</text>
</svg>
