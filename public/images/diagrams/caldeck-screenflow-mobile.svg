<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 796" width="420" height="796" role="img">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#111117" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="stripe" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f1f1f4"/><rect width="4" height="10" fill="#dcdce2"/>
    </pattern>
  </defs>
  <rect width="420" height="796" rx="28" fill="#ffffff"/>
  <text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.2">How the screens connect</text><text x="24" y="84" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">Two ways in, one path through, and always back</text><text x="24" y="105" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">to the day you started on.</text><rect x="110" y="146" width="200" height="76" rx="14" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="126" y="177" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#111117" text-anchor="start">The calendar</text><text x="126" y="199" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Home. Day, week, month.</text><rect x="24" y="278" width="178" height="110" rx="14" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><path d="M44 298.5 C44.99 303.01 44.99 303.01 49.5 304 C44.99 304.99 44.99 304.99 44 309.5 C43.01 304.99 43.01 304.99 38.5 304 C43.01 303.01 43.01 303.01 44 298.5Z" fill="#c2600c"/><text x="56" y="309" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#c2600c" text-anchor="start">Calendar mode</text><text x="40" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Your day. Ask</text><text x="40" y="349" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">assistant opens a</text><text x="40" y="367" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">sheet over it.</text><rect x="218" y="278" width="178" height="110" rx="14" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><path d="M238 298.5 C238.99 303.01 238.99 303.01 243.5 304 C238.99 304.99 238.99 304.99 238 309.5 C237.01 304.99 237.01 304.99 232.5 304 C237.01 303.01 237.01 303.01 238 298.5Z" fill="#c2600c"/><text x="250" y="309" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#c2600c" text-anchor="start">Assistant mode</text><text x="234" y="331" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Switch at the top.</text><text x="234" y="349" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Its own full screen.</text><rect x="24" y="442" width="226" height="90" rx="14" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><text x="40" y="473" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#111117" text-anchor="start">Options</text><text x="40" y="495" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Three times, ranked, each</text><text x="40" y="513" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">with a reason.</text><rect x="282" y="442" width="110" height="90" rx="14" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.5" stroke-dasharray="6 5"/><text x="298" y="473" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#111117" text-anchor="start">Focus Time</text><text x="298" y="495" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">Read as a</text><text x="298" y="513" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">rule.</text><rect x="24" y="576" width="226" height="76" rx="14" fill="#ffffff" stroke="#111117" stroke-width="2.5"/><text x="40" y="607" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#111117" text-anchor="start">Review</text><text x="40" y="629" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#6e6e78" text-anchor="start">You press send.</text><path d="M210 222 L210 238 Q210 250 198 250 L125 250 Q113 250 113 261 L113 272" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M210 250 L295 250 Q307 250 307 261 L307 272" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M113 388 L113 436" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M307 388 L307 400 Q307 412 295 412 L224 412 Q212 412 212 424 L212 436" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><path d="M282 487 L256 487" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#a)"/><path d="M137 532 L137 570" fill="none" stroke="#111117" stroke-width="2" stroke-linecap="round" marker-end="url(#ai)"/><path d="M250 614 L392 614 Q404 614 404 602 L404 196 Q404 184 392 184 L316 184" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#a)"/><text x="266" y="638" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#3f3f48" text-anchor="start">Sent or cancelled:</text><text x="266" y="656" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#3f3f48" text-anchor="start">back to the day</text><text x="266" y="674" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#3f3f48" text-anchor="start">you started on</text><rect x="24" y="697" width="22" height="16" rx="5" fill="#fbf1e8" stroke="#c2600c" stroke-width="1.5"/><text x="58" y="711" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">The assistant</text><rect x="24" y="725" width="22" height="16" rx="5" fill="#ffffff" stroke="#111117" stroke-width="2"/><text x="58" y="739" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">Where you decide</text><rect x="24" y="753" width="22" height="16" rx="5" fill="#ffffff" stroke="#d6d6dd" stroke-width="1.5" stroke-dasharray="4 3"/><text x="58" y="767" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">Read, never visited</text>
</svg>
