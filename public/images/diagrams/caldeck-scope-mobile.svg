  <text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.2">What CalDeck AI is, and what</text><text x="24" y="78" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="650" fill="#111117" text-anchor="start" letter-spacing="-0.2">this study covers</text><text x="24" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">A complete calendar. The case study zooms in on</text><text x="24" y="133" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e78" text-anchor="start">the assistant inside it.</text><rect x="24" y="168" width="372" height="644" rx="18" fill="#f4f4f6" stroke="none" stroke-width="1.5"/><text x="42" y="202" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="650" fill="#6e6e78" text-anchor="start" letter-spacing="1.6">THE CALENDAR</text><rect x="42" y="220" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="123.5" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Day, week, month</text><rect x="215" y="220" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="296.5" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Events</text><rect x="42" y="272" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="123.5" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Create and invite</text><rect x="215" y="272" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="296.5" y="298" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Search</text><rect x="42" y="324" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="123.5" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Reminders</text><rect x="215" y="324" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="296.5" y="350" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Notifications</text><rect x="42" y="376" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="123.5" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Accounts and sync</text><rect x="215" y="376" width="163" height="42" rx="10" fill="#ffffff" stroke="#e8e8ed" stroke-width="1"/><text x="296.5" y="402" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#3f3f48" text-anchor="middle">Sharing</text><rect x="38" y="436" width="344" height="362" rx="16" fill="#fbf1e8" stroke="#c2600c" stroke-width="2"/><path d="M62 457 C63.26 462.74 63.26 462.74 69 464 C63.26 465.26 63.26 465.26 62 471 C60.74 465.26 60.74 465.26 55 464 C60.74 462.74 60.74 462.74 62 457Z" fill="#c2600c"/><text x="78" y="469" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="650" fill="#c2600c" text-anchor="start" letter-spacing="1.6">WHAT THIS STUDY COVERS</text><rect x="52" y="488" width="316" height="92" rx="12" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="68" y="518" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">Moving a meeting</text><text x="68" y="542" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">Ranks the times that work, then stops</text><text x="68" y="561" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">before sending.</text><rect x="52" y="590" width="316" height="92" rx="12" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="68" y="620" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">Focus Time</text><text x="68" y="644" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">Hours you protect once, which every</text><text x="68" y="663" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">suggestion respects.</text><rect x="52" y="692" width="316" height="92" rx="12" fill="#ffffff" stroke="#e7b58c" stroke-width="1.5"/><text x="68" y="722" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="650" fill="#111117" text-anchor="start">When things go wrong</text><text x="68" y="746" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">Four situations that change the shape</text><text x="68" y="765" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#6e6e78" text-anchor="start">of the screen.</text>
