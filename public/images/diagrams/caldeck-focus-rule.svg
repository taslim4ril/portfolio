<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img">
  <rect width="1200" height="470" rx="26" fill="#141416" stroke="#26262a" stroke-width="1.5"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3a3a42"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/>
    </marker>
  </defs>
  <text x="56" y="62" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#ffffff" text-anchor="start">Focus Time is a rule, not a hint</text><text x="56" y="90" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">The switch is enforced by the product. The assistant never gets to interpret it.</text><rect x="56" y="146" width="300" height="150" rx="16" fill="#1e1e23" stroke="#3a3a42" stroke-width="1.5"/><text x="84" y="186" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8a8a92" text-anchor="start" letter-spacing="1.4">YOUR SETTING</text><text x="84" y="222" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="start">Protect 9 – 11 AM</text><text x="84" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8a8a92" text-anchor="start">You decide once, in settings,</text><text x="84" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8a8a92" text-anchor="start">instead of being asked every time.</text><line x1="362" y1="221" x2="432" y2="221" stroke="#3a3a42" stroke-width="1.6" marker-end="url(#a)"/><rect x="440" y="176" width="200" height="90" rx="14" fill="rgba(255,255,255,0.06)" stroke="#ffffff" stroke-width="1.6"/><text x="540" y="214" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Scheduling engine</text><text x="540" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8a8a92" text-anchor="middle">checks the rule</text><path d="M646 205 H 700 V 150" fill="none" stroke="#3a3a42" stroke-width="1.5" marker-end="url(#a)"/><path d="M646 240 H 700 V 300" fill="none" stroke="#3a3a42" stroke-width="1.5" marker-end="url(#a)"/><rect x="708" y="116" width="436" height="78" rx="14" fill="rgba(251,146,60,0.06)" stroke="rgba(251,146,60,0.5)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="732" y="146" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#fb923c" text-anchor="start">Outside your focus hours</text><text x="732" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c6c6cd" text-anchor="start">The slot can be offered like any other</text><rect x="708" y="266" width="436" height="100" rx="14" fill="#1e1e23" stroke="#3a3a42" stroke-width="1.5"/><text x="732" y="296" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="start">Inside your focus hours</text><text x="732" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c6c6cd" text-anchor="start">Still offered, but the cost is written on the</text><text x="732" y="338" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c6c6cd" text-anchor="start">screen: this cuts Monday's deep work to thirty</text><text x="732" y="356" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c6c6cd" text-anchor="start">minutes.</text><text x="56" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">The meeting flow reads this setting rather than guessing, which is what makes the warning in the picker</text><text x="56" y="429" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8a8a92" text-anchor="start">trustworthy.</text>
</svg>
